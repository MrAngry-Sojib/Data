<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>তথ্য সংগ্রহ ফর্ম</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f1f5f9;
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .form-container {
      background: #ffffff;
      width: 100%;
      max-width: 500px;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    h2 {
      text-align: center;
      color: #1e3a8a;
      margin-top: 0;
      margin-bottom: 20px;
    }
    .step-indicator {
      display: flex;
      justify-content: space-between;
      margin-bottom: 25px;
      font-weight: 600;
      color: #64748b;
      font-size: 14px;
    }
    .step-indicator .active {
      color: #2563eb;
      border-bottom: 2px solid #2563eb;
      padding-bottom: 4px;
    }
    .form-step {
      display: none;
    }
    .form-step.active {
      display: block;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      color: #334155;
      font-size: 14px;
    }
    label .required {
      color: #ef4444;
    }
    label .optional {
      font-size: 12px;
      color: #94a3b8;
    }
    input[type="text"],
    input[type="date"],
    input[type="tel"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #2563eb;
    }
    .fixed-note {
      background: #eff6ff;
      padding: 10px 12px;
      border-left: 3px solid #2563eb;
      font-size: 13px;
      color: #1e40af;
      margin-top: 10px;
      border-radius: 4px;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-next, .btn-submit {
      background-color: #2563eb;
      color: #ffffff;
    }
    .btn-next:hover, .btn-submit:hover {
      background-color: #1d4ed8;
    }
    .btn-prev {
      background-color: #e2e8f0;
      color: #475569;
    }
    .btn-prev:hover {
      background-color: #cbd5e1;
    }
    button:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }
    #statusMessage {
      margin-top: 15px;
      text-align: center;
      font-weight: 600;
      font-size: 14px;
    }
    .success { color: #16a34a; }
    .error { color: #dc2626; }
  </style>
</head>
<body>

<div class="form-container">
  <h2>তথ্য এন্ট্রি ফরম</h2>
  
  <div class="step-indicator">
    <span id="step1Indicator" class="active">১. ব্যক্তিগত তথ্য</span>
    <span id="step2Indicator">২. ঠিকানা ও ফোন</span>
  </div>

  <form id="entryForm">
    <!-- ধাপ ১: ব্যক্তিগত তথ্য -->
    <div class="form-step active" id="step1">
      <div class="form-group">
        <label>নাম ( বাংলা ) : <span class="required">*</span></label>
        <input type="text" id="nameBn" placeholder="বাংলায় নাম লিখুন" required>
      </div>

      <div class="form-group">
        <label>Name ( English ) : <span class="required">*</span></label>
        <input type="text" id="nameEn" placeholder="Write name in English" required>
      </div>

      <div class="form-group">
        <label>পিতা : <span class="required">*</span></label>
        <input type="text" id="father" placeholder="পিতার নাম" required>
      </div>

      <div class="form-group">
        <label>মাতা : <span class="required">*</span></label>
        <input type="text" id="mother" placeholder="মাতার নাম" required>
      </div>

      <div class="form-group">
        <label>Date of birth : <span class="required">*</span></label>
        <input type="date" id="dob" required>
      </div>

      <div class="form-group">
        <label>I'd no : <span class="required">*</span></label>
        <input type="text" id="idNo" placeholder="আইডি নম্বর দিন" required>
      </div>

      <div class="btn-group">
        <button type="button" class="btn-next" onclick="goToStep(2)">পরবর্তী (Next)</button>
      </div>
    </div>

    <!-- ধাপ ২: ঠিকানা ও ফোন নম্বর -->
    <div class="form-step" id="step2">
      <div class="form-group">
        <label>গ্রাম :</label>
        <input type="text" id="village" value="বেলকা">
      </div>

      <div class="form-group">
        <label>ডাকঘর :</label>
        <input type="text" id="postOffice" value="বেলকা - ৫৭০০">
      </div>

      <div class="fixed-note">
        অটোমেটিক যুক্ত হবে: <b>সুন্দরগঞ্জ,গাইবান্ধা</b>
      </div>

      <div class="form-group" style="margin-top: 16px;">
        <label>ফোন নম্বর : <span class="optional">(ঐচ্ছিক - দিতে পারেন অথবা নাও পারেন)</span></label>
        <input type="tel" id="phone" placeholder="01XXXXXXXXX">
      </div>

      <div class="btn-group">
        <button type="button" class="btn-prev" onclick="goToStep(1)">পেছনে (Back)</button>
        <button type="submit" class="btn-submit" id="submitBtn">সাবমিট করুন</button>
      </div>
    </div>
  </form>

  <div id="statusMessage"></div>
</div>

<script>
  // আপনার দেওয়া Google Apps Script Web App URL
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx07t5cBck2gFh5U_sE6P9p-Wv7wmMtSlnzwsY6-Fmez6cFuN3-sNUgQUVu4M314iYQ/exec";

  function goToStep(step) {
    if (step === 2) {
      const requiredInputs = document.querySelectorAll('#step1 input[required]');
      for (let input of requiredInputs) {
        if (!input.value.trim()) {
          alert('দয়া করে ধাপ ১ এর সব প্রয়োজনীয় তথ্য দিন।');
          input.focus();
          return;
        }
      }
      document.getElementById('step1').classList.remove('active');
      document.getElementById('step2').classList.add('active');
      document.getElementById('step1Indicator').classList.remove('active');
      document.getElementById('step2Indicator').classList.add('active');
    } else {
      document.getElementById('step2').classList.remove('active');
      document.getElementById('step1').classList.add('active');
      document.getElementById('step2Indicator').classList.remove('active');
      document.getElementById('step1Indicator').classList.add('active');
    }
  }

  // জন্মতারিখকে "02 Jun 2006" ফরম্যাটে রূপান্তর করার ফাংশন
  function formatDateToCustom(dateString) {
    if (!dateString) return "";
    const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    const parts = dateString.split("-");
    if (parts.length !== 3) return dateString;
    
    const year = parts[0];
    const month = months[parseInt(parts[1], 10) - 1];
    const day = parts[2].padStart(2, "0");
    
    return `${day} ${month} ${year}`;
  }

  document.getElementById('entryForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMessage');

    submitBtn.disabled = true;
    submitBtn.innerText = "সংরক্ষণ হচ্ছে...";
    statusMsg.className = "";
    statusMsg.innerText = "";

    const village = document.getElementById('village').value.trim();
    const postOffice = document.getElementById('postOffice').value.trim();
    const fullAddress = `গ্রাম : ${village} , ডাকঘর : ${postOffice} , সুন্দরগঞ্জ,গাইবান্ধা`;

    const rawDob = document.getElementById('dob').value;
    const formattedDob = formatDateToCustom(rawDob);

    const payload = {
      nameBn: document.getElementById('nameBn').value.trim(),
      nameEn: document.getElementById('nameEn').value.trim(),
      father: document.getElementById('father').value.trim(),
      mother: document.getElementById('mother').value.trim(),
      dob: formattedDob,
      idNo: document.getElementById('idNo').value.trim(),
      fullAddress: fullAddress,
      phone: document.getElementById('phone').value.trim()
    };

    fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
      if (data.result === "success") {
        statusMsg.className = "success";
        statusMsg.innerText = "✓ তথ্য সফলভাবে শিটে জমা হয়েছে!";
        document.getElementById('entryForm').reset();
        
        // ডিফল্ট মান পুনরায় সেট
        document.getElementById('village').value = "বেলকা";
        document.getElementById('postOffice').value = "বেলকা - ৫৭০০";

        setTimeout(() => {
          goToStep(1);
          statusMsg.innerText = "";
        }, 1500);
      } else {
        throw new Error(data.error || "সমস্যা হয়েছে");
      }
    })
    .catch(err => {
      statusMsg.className = "error";
      statusMsg.innerText = "ডাটা পাঠাতে সমস্যা হয়েছে! দয়া করে আবার চেষ্টা করুন।";
      console.error(err);
    })
    .finally(() => {
      submitBtn.disabled = false;
      submitBtn.innerText = "সাবমিট করুন";
    });
  });
</script>

</body>
</html>
